<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3CradialGradient id='g' cx='.35' cy='.3'%3E%3Cstop offset='0' stop-color='%23fff'/%3E%3Cstop offset='.4' stop-color='%23b9c0c6'/%3E%3Cstop offset='1' stop-color='%23444b52'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='16' r='14' fill='url(%23g)'/%3E%3C/svg%3E">

<title>Материал и коррозия</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Archivo+Narrow:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: dark editorial landing (3D liquid-metal hero) → scroll-driven mine fly-through → four tools (advisor / selector / simulator / battery).
   Palette: deliberately dark-only. Graphite rock neutrals, molten-metal orange as the single accent. */
:root {
  --bg: #0a0c0d;
  --surface: #13171a;
  --surface2: #1a1f22;
  --ink: #eef0ee;
  --muted: #9aa4a2;
  --line: #283034;
  --rust: #ff6a2b;
  --rust-soft: #4a2414;
  --steel: #8fb0c4;
  --good: #5bbd84;
  --bad: #ff7d68;
  --s1: #8fb0c4; --s2: #ff6a2b; --s3: #5bbd84; --s4: #b496dc; --s5: #e2b44a; --s6: #5cc3dc;
  --font-display: "Archivo", system-ui, sans-serif;
  --font-body: "Archivo", system-ui, sans-serif;
  --font-label: "Archivo Narrow", "Arial Narrow", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, monospace;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; margin: 0; overflow-x: hidden; }
a { color: inherit; }
button { font-family: inherit; }
.gutter { padding-left: var(--gutter-l); padding-right: var(--gutter-r); }

/* ---------- верхняя навигация ---------- */
.topnav { position: fixed; z-index: 20; top: calc(env(safe-area-inset-top, 0px) + 12px); left: 0; right: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-left: var(--gutter-l); padding-right: var(--gutter-r); pointer-events: none; }
.topnav > * { pointer-events: auto; }
.brand { display: flex; align-items: center; gap: 10px; font: 700 14px var(--font-display); font-stretch: 110%; letter-spacing: .01em; text-decoration: none; background: rgba(10,12,13,.6); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding: 8px 14px 8px 10px; border-radius: 999px; border: 1px solid var(--line); }
.brand i { width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #b9c0c6 35%, #444b52 75%); box-shadow: 0 1px 3px rgba(0,0,0,.5); }
.links { display: flex; gap: 2px; background: rgba(10,12,13,.6); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 999px; padding: 4px; }
.links a { font-size: 13px; text-decoration: none; color: var(--muted); padding: 6px 12px; border-radius: 999px; }
.links a:hover, .links a.on { color: var(--ink); background: var(--surface2); }
.navr { display: flex; align-items: center; gap: 8px; }
.lang { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: rgba(10,12,13,.6); }
.lang button { font: 600 12px var(--font-label); letter-spacing: .08em; padding: 7px 11px; border: 0; background: transparent; color: var(--muted); cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.pill { display: inline-flex; align-items: center; gap: 10px; font: 600 14px var(--font-body); text-decoration: none; border-radius: 999px; padding: 10px 10px 10px 18px; background: var(--rust); color: #140804; border: 0; cursor: pointer; }
.pill b { width: 26px; height: 26px; border-radius: 50%; background: #140804; color: var(--rust); display: grid; place-items: center; font-size: 14px; }
.pill.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); padding: 10px 18px; }
.pill.sm { padding: 7px 7px 7px 14px; font-size: 13px; }
.pill.sm b { width: 22px; height: 22px; }
@media (max-width: 860px) { .links { display: none; } }
@media (max-width: 420px) { .brand span { display: none; } }

/* ---------- главный экран ---------- */
.hero { position: relative; min-height: max(620px, 92vh); display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden;
  background: radial-gradient(60% 70% at 72% 42%, #1d1612 0%, var(--bg) 70%); }
.hero canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hero-in { position: relative; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 24px; padding-block: 120px 40px; max-width: 1280px; width: 100%; margin: 0 auto; }
.eyebrow { font: 600 12px var(--font-label); letter-spacing: .16em; text-transform: uppercase; color: var(--rust); margin: 0 0 14px; }
.hero h1 { font-family: var(--font-display); font-stretch: 112%; font-weight: 600; font-size: clamp(38px, 6.4vw, 84px); line-height: .98; letter-spacing: -0.035em; margin: 0; max-width: 13ch; text-wrap: balance; }
.hero h1 span { display: block; }
.hero h1 span + span { color: var(--muted); font-weight: 400; }
.hero p.lead { color: var(--muted); max-width: 46ch; margin: 18px 0 26px; font-size: 16px; }
.hero .ctas { display: flex; flex-wrap: wrap; gap: 10px; }
.hero-stats { display: flex; gap: 22px; font-family: var(--font-data); font-size: 12.5px; color: var(--muted); }
.hero-stats b { display: block; font: 600 26px var(--font-display); font-stretch: 112%; color: var(--ink); }

/* ---------- шахта ---------- */
.cave { position: relative; height: 760vh; background: #070808; }
.cave-sticky { position: sticky; top: 0; height: 100vh; overflow: hidden; }
.cave canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.cave-fallback { position: absolute; inset: 0; background: radial-gradient(50% 60% at 50% 55%, #2a1d15, #070808 70%); }
.cave-ui { position: absolute; inset: 0; pointer-events: none; }
.cave-ui .card { position: absolute; left: var(--gutter-l); bottom: 40px; max-width: min(440px, calc(100% - 32px)); opacity: 0; transform: translateY(14px); transition: opacity .45s ease, transform .45s ease; }
.cave-ui .card.on { opacity: 1; transform: none; pointer-events: auto; }
.cave-ui .intro, .cave-ui .outro { left: 50%; bottom: auto; top: 50%; transform: translate(-50%, -40%); text-align: center; max-width: min(560px, calc(100% - 32px)); }
.cave-ui .intro.on, .cave-ui .outro.on { transform: translate(-50%, -50%); }
@media (prefers-reduced-motion: reduce) { .cave-ui .card { transition: none; } }
.cave-ui h2 { font-family: var(--font-display); font-stretch: 112%; font-weight: 600; font-size: clamp(30px, 5vw, 56px); line-height: 1; letter-spacing: -0.03em; margin: 0 0 12px; text-wrap: balance; }
.cave-ui p { color: #c9cfcd; margin: 0 0 16px; }
.scroll-hint { font-family: var(--font-data); font-size: 12px; color: var(--muted); letter-spacing: .1em; }
.stop { background: rgba(10,12,13,.72); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,.08); padding: 18px 20px; }
.stop .sym { display: flex; align-items: baseline; gap: 12px; }
.stop .swatch { align-self: center; width: 52px; height: 52px; border-radius: 50%; background-size: 180%; background-position: center; background-color: var(--mc); background-blend-mode: multiply; box-shadow: inset -8px -10px 16px rgba(0,0,0,.55), inset 6px 6px 12px rgba(255,255,255,.25), 0 6px 16px rgba(0,0,0,.5); flex: none; }
.stop .sym b { font: 700 64px var(--font-display); font-stretch: 112%; line-height: .9; color: var(--mc); letter-spacing: -0.04em; }
.stop .sym span { font: 600 22px var(--font-display); }
.stop .sym small { font-family: var(--font-data); color: var(--muted); font-size: 12px; margin-left: auto; }
.stop dl { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 16px; margin: 14px 0 0; }
.stop dl div.w { grid-column: 1 / -1; }
.stop dt { font: 600 10.5px var(--font-label); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.stop dd { margin: 0; font-size: 14px; }
.stop dd.n { font-family: var(--font-data); }
.rail { position: absolute; right: var(--gutter-r); top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 10px; align-items: flex-end; }
.rail span { font: 600 11px var(--font-data); color: var(--muted); display: flex; align-items: center; gap: 8px; transition: color .3s; }
.rail span::after { content: ""; width: 18px; height: 2px; background: var(--line); transition: background .3s, width .3s; }
.rail span.on { color: var(--ink); }
.rail span.on::after { background: var(--rust); width: 34px; }
.depth { position: absolute; right: var(--gutter-r); bottom: 32px; font: 500 12px var(--font-data); color: var(--muted); text-align: right; }
.depth b { display: block; font: 600 28px var(--font-display); font-stretch: 112%; color: var(--ink); }
@media (max-width: 640px) { .rail { display: none; } .cave-ui .card.stop { bottom: 96px; } }

/* ---------- инструменты ---------- */
.tools { scroll-margin-top: 70px; padding-block: 110px 64px; }
.wrap { max-width: 1120px; margin: 0 auto; }
.tools header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px 24px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
.tools h1 { font-family: var(--font-display); font-stretch: 112%; font-weight: 600; font-size: clamp(30px, 4.6vw, 48px); line-height: 1.02; margin: 0; letter-spacing: -0.03em; text-wrap: balance; }
.tools h1 .acc { color: var(--rust); }
.sub { margin: 8px 0 0; color: var(--muted); max-width: 52ch; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px; }
.tab { font: 600 13px var(--font-body); padding: 8px 16px; border: 0; border-radius: 999px; background: transparent; color: var(--muted); cursor: pointer; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); }
.tab:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--rust); outline-offset: 2px; }
.grid { display: grid; grid-template-columns: minmax(250px, 310px) minmax(0, 1fr); gap: 28px; margin-top: 24px; align-items: start; }
@media (max-width: 800px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--surface); border: 1px solid var(--line); padding: 18px; display: flex; flex-direction: column; gap: 16px; }
.panel h2, .results h2 { font: 700 13px var(--font-label); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label, .field .lab { font-weight: 500; font-size: 13px; display: flex; justify-content: space-between; gap: 8px; }
.field output { font-family: var(--font-data); color: var(--rust); }
select { font: inherit; padding: 8px 10px; background: var(--bg); color: var(--ink); border: 1px solid var(--line); width: 100%; }
input[type=range] { width: 100%; accent-color: var(--rust); }
.hint { color: var(--muted); font-size: 12.5px; margin: 0; }
.results { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.mat { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 8px 14px; background: var(--surface); border: 1px solid var(--line); padding: 14px 16px; align-items: center; }
.mat.fail { background: transparent; border-style: dashed; }
.rank { font: 700 26px var(--font-label); color: var(--rust); text-align: center; }
.mat.fail .rank { color: var(--muted); font-size: 18px; }
.mat h3 { margin: 0; font-size: 16px; font-weight: 600; }
.grp { margin: 0; color: var(--muted); font-size: 12.5px; }
.score { font: 500 22px var(--font-data); text-align: right; }
.score small { display: block; font: 600 10px var(--font-label); letter-spacing: .1em; color: var(--muted); text-transform: uppercase; }
.stats { grid-column: 2 / 4; display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 6px 14px; margin: 0; }
.stats div { min-width: 0; }
.stats dt { font: 600 10.5px var(--font-label); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.stats dd { margin: 0; font: 400 14px var(--font-data); font-variant-numeric: tabular-nums; }
.bar { grid-column: 2 / 4; height: 6px; background: var(--rust-soft); position: relative; }
.bar i { position: absolute; inset: 0 auto 0 0; background: var(--steel); }
.bar b { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--rust); left: 75%; }
.fail-why { grid-column: 2 / 4; color: var(--bad); font-size: 13px; margin: 0; }
.act { grid-column: 2 / 4; justify-self: start; font: 600 13px var(--font-label); letter-spacing: .06em; text-transform: uppercase; background: transparent; border: 1px solid var(--ink); color: var(--ink); padding: 6px 12px; cursor: pointer; }
.act:hover { background: var(--ink); color: var(--bg); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 500 12.5px var(--font-body); padding: 6px 12px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; }
.chip:hover { color: var(--ink); }
.chip i { width: 10px; height: 10px; display: inline-block; border: 1px solid var(--muted); border-radius: 50%; }
.chip[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); }
.chip[aria-pressed="true"] i { border-color: transparent; }
.plot { background: var(--surface); border: 1px solid var(--line); padding: 12px; }
.plot svg { width: 100%; height: auto; display: block; }
.plot text { font-family: var(--font-data); font-size: 11px; fill: var(--muted); }
.readout { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 0; }
.readout div { background: var(--surface); border: 1px solid var(--line); padding: 10px 14px; }
.readout dt { font: 600 10.5px var(--font-label); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.readout dd { margin: 2px 0 0; font: 500 20px var(--font-data); font-variant-numeric: tabular-nums; }
.note { font-size: 12.5px; color: var(--muted); margin: 28px auto 0; max-width: 1120px; border-top: 1px solid var(--line); padding-top: 12px; }
.note + .note { margin-top: 12px; }
@media (prefers-reduced-motion: no-preference) { .bar i { transition: width .25s ease; } }
textarea { font: inherit; padding: 10px; background: var(--bg); color: var(--ink); border: 1px solid var(--line); width: 100%; resize: vertical; }
textarea:focus-visible { outline: 2px solid var(--rust); outline-offset: 2px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.go { font: 700 14px var(--font-body); background: var(--rust); color: #140804; border: 0; border-radius: 999px; padding: 11px 20px; cursor: pointer; }
.go:disabled { opacity: .55; cursor: default; }
.row .act, .btns .act { grid-column: auto; }
.btns { grid-column: 2 / 4; display: flex; flex-wrap: wrap; gap: 8px; }
.why { grid-column: 2 / 4; margin: 0; }
.mat .note2 { grid-column: 2 / 4; margin: 0; color: var(--muted); font-size: 13px; }
.summary { margin: 0; font-size: 16px; max-width: 65ch; }
.badge { display: inline-block; font: 600 10.5px var(--font-label); letter-spacing: .1em; text-transform: uppercase; color: var(--rust); border: 1px solid var(--rust); padding: 4px 10px; }
.cond { margin: 0; font-family: var(--font-data); font-size: 13px; color: var(--muted); }
.tips { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.avoid { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; }
.avoid b { color: var(--bad); font-weight: 600; }
.tbl { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font: 600 11px var(--font-label); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
td:nth-child(2), td:nth-child(3) { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
tbody tr:last-child td { border-bottom: 0; }

/* ---------- батарея: витрина «банок» ---------- */
.bwrap { display: flex; flex-direction: column; gap: 14px; margin-top: 24px; }
.bstage { position: relative; overflow: hidden; min-height: 420px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; padding: 36px 20px 28px;
  background: radial-gradient(70% 90% at 50% 120%, rgba(0,0,0,.55), transparent 60%), linear-gradient(115deg, var(--ca) 0%, color-mix(in srgb, var(--ca) 35%, #0a0c0d) 46%, color-mix(in srgb, var(--cb) 35%, #0a0c0d) 54%, var(--cb) 100%); }
.bghost { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font: 800 clamp(110px, 26vw, 300px) var(--font-display); font-stretch: 125%; letter-spacing: -0.05em; color: transparent; -webkit-text-stroke: 1.5px rgba(255,255,255,.22); white-space: nowrap; pointer-events: none; user-select: none; }
.bside { display: flex; flex-direction: column; align-items: center; gap: 12px; position: relative; }
.bside .role { font: 600 12px var(--font-label); letter-spacing: .14em; text-transform: uppercase; color: #fff; background: rgba(0,0,0,.4); padding: 5px 12px; border-radius: 999px; }
.bside .nm { font: 600 15px var(--font-display); color: #fff; text-shadow: 0 1px 8px rgba(0,0,0,.5); }
.bmid { position: relative; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.volt { font: 700 clamp(48px, 9vw, 112px) var(--font-display); font-stretch: 115%; letter-spacing: -0.04em; line-height: .95; color: #fff; text-shadow: 0 4px 30px rgba(0,0,0,.45); font-variant-numeric: tabular-nums; }
.volt-l { font: 600 11px var(--font-label); letter-spacing: .16em; text-transform: uppercase; color: #fff; text-shadow: 0 1px 6px rgba(0,0,0,.6); }
.swap { margin-top: 10px; font: 600 12px var(--font-body); color: #fff; background: rgba(0,0,0,.4); border: 1px solid rgba(255,255,255,.35); border-radius: 999px; padding: 7px 14px; cursor: pointer; }
.halfline { position: relative; grid-column: 1 / -1; text-align: center; font-family: var(--font-data); font-size: 13px; color: #fff; margin: 0; text-shadow: 0 1px 6px rgba(0,0,0,.6); }
.bwarn { position: relative; grid-column: 1 / -1; justify-self: center; text-align: center; margin: 0; color: #fff; background: rgba(0,0,0,.55); padding: 8px 14px; font-size: 13px; }
.bwarn:empty { display: none; }
@media (max-width: 640px) { .bstage { grid-template-columns: 1fr 1fr; } .bmid { grid-column: 1 / -1; order: -1; } }
/* банка: цилиндр из градиентов */
.can { --c: #888; position: relative; width: 112px; height: 210px; border-radius: 16px / 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #fff;
  background: linear-gradient(90deg, color-mix(in srgb, var(--c) 45%, #000) 0%, var(--c) 22%, color-mix(in srgb, var(--c) 55%, #fff) 38%, var(--c) 52%, color-mix(in srgb, var(--c) 60%, #000) 100%);
  box-shadow: 0 24px 40px -18px rgba(0,0,0,.7), inset 0 -10px 18px rgba(0,0,0,.25); border: 0; }
.can::before { content: ""; position: absolute; left: 6px; right: 6px; top: -7px; height: 16px; border-radius: 50%; background: linear-gradient(180deg, #e9ecef, #8d949b); box-shadow: inset 0 -3px 4px rgba(0,0,0,.3); }
.can .sym { font: 800 46px var(--font-display); font-stretch: 112%; letter-spacing: -0.03em; text-shadow: 0 2px 10px rgba(0,0,0,.45); }
.can .e { font: 500 12px var(--font-data); background: rgba(0,0,0,.4); padding: 2px 8px; border-radius: 999px; }
.bside .can { width: clamp(96px, 14vw, 132px); height: clamp(180px, 26vw, 250px); }
@media (prefers-reduced-motion: no-preference) {
  .bside .can { animation: bob 4s ease-in-out infinite; }
  #bigCat { animation-delay: -2s; }
}
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-10px) rotate(2deg); } }
.picker { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--surface); }
.seg button { font: 600 13px var(--font-body); padding: 7px 14px; border: 0; border-radius: 999px; background: transparent; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.shelf { display: flex; gap: 14px; overflow-x: auto; padding: 30px 6px 14px; scroll-snap-type: x proximity; }
.shelf .can { flex: 0 0 auto; width: 62px; height: 112px; cursor: pointer; scroll-snap-align: start; transition: transform .2s ease, opacity .2s; opacity: .8; }
.shelf .can .sym { font-size: 24px; }

function rankMaterials(s) {
  const rows = MAT.map(m => {
    const lossUm = loss(m, s, s.life), frac = lossUm / (s.t0 * 1000);
    const mass = m.rho * s.t0, cost = mass * (m.p[0] + m.p[1]) / 2;
    const why = [];
    if (m.y < s.ymin) why.push(tf('why_yield', { y: m.y }));
    if (m.rho > s.rmax) why.push(tf('why_rho', { r: fmtN(m.rho, 2) }));
    if (frac > LIMIT) why.push(tf('why_corr', { l: s.life, p: Math.min(100, Math.round(frac * 100)) }));
    return { m, lossUm, frac, mass, cost, why };
  });
  const ok = rows.filter(r => !r.why.length), bad = rows.filter(r => r.why.length);
  const norm = (arr, f) => { const v = arr.map(f), lo = Math.min(...v), hi = Math.max(...v); return x => hi === lo ? 0 : (f(x) - lo) / (hi - lo); };
  if (ok.length) {
    const nc = norm(ok, r => r.cost), nm = norm(ok, r => r.mass), nd = norm(ok, r => r.frac);
    const sum = (s.wc + s.ww + s.wd) || 1;
    ok.forEach(r => r.score = Math.round(100 * (1 - (s.wc * nc(r) + s.ww * nm(r) + s.wd * nd(r)) / sum)));
    ok.sort((a, b) => b.score - a.score);
  }
  return { ok, bad };
}

  $('env').value = d.env; applyEnvDefaults();
  $('temp').value = d.temp; $('rh').value = d.rh;
  $('t0').value = Math.min(30, Math.max(1, Math.round(r.thickness_mm * 2) / 2));

  $('prot').value = 'none';
  if (d.params) ['ymin', 'wc', 'ww', 'wd'].forEach(k => { $(k).value = d.params[k]; });
  $('focus').value = r.materialId;
  refresh(); show('sel'); toTools();
});

let TAB = 'ai';

  const num = s => LANG === 'en' ? s.replace(/,/g, '.') : s;
  $('bTable').innerHTML = REAL.map(r => `<tr><td>${esc(L(r[0]))}</td><td>${num(r[1])} ${t('u_V')}</td><td>${r[2]}</td><td>${esc(L(r[3]))}</td></tr>`).join('');
  $('aiStatus').textContent = t(aiStatusKey);
  setHeader();

}
function setLang(l) {

  if (lastAI?.offline) lastAI = offlineAdvise(lastAI.task);

$('slotCat').onclick = () => { bat.slot = 'cat'; renderBat(); };

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function makeRenderer(canvas, alpha) {
  const r = new THREE.WebGLRenderer({ canvas, antialias: true, alpha });
  r.setPixelRatio(Math.min(devicePixelRatio, 2));
  r.toneMapping = THREE.ACESFilmicToneMapping;
  r.outputColorSpace = THREE.SRGBColorSpace;
  return r;
}
function fit(r, cam) {
  const c = r.domElement, w = c.clientWidth, h = c.clientHeight;
  if (!w || !h) return false;
  if (c.width !== Math.round(w * r.getPixelRatio()) || c.height !== Math.round(h * r.getPixelRatio())) {
    r.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); return true;
  }
  return false;
}
function watch(el) {
  const s = { on: true };
  new IntersectionObserver(([e]) => { s.on = e.isIntersecting; }).observe(el);
  return s;
}
// дешёвый «шум» из синусов: достаточно для камня
const n3 = (x, y, z) => Math.sin(x * 1.7 + Math.sin(y * 1.3)) * Math.cos(y * 1.9 + Math.sin(z * 1.1)) + 0.5 * Math.sin(z * 3.1 + x * 2.3) * Math.cos(x * 2.9 - y * 1.7);

/* ---------- главный экран: жидкий металл и решётка атомов ---------- */
{
  const canvas = document.getElementById('heroCanvas');
  const r = makeRenderer(canvas, true);
  const scene = new THREE.Scene();
  const pm = new THREE.PMREMGenerator(r);
  scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
  const cam = new THREE.PerspectiveCamera(32, 1, 0.1, 100);
  cam.position.set(0, 0, 8);
  const group = new THREE.Group();
  scene.add(group);

  const geo = new THREE.SphereGeometry(1.35, 128, 96);
  const base = geo.attributes.position.array.slice();
  const blob = new THREE.Mesh(geo, new THREE.MeshPhysicalMaterial({ color: 0xe8ebef, metalness: 1, roughness: 0.18, clearcoat: 1, clearcoatRoughness: 0.1, envMapIntensity: 1.8 }));
  group.add(blob);
  const warm = new THREE.PointLight(0xff6a2b, 60, 0, 2); warm.position.set(3, -1.5, 2.5); scene.add(warm);
  const cool = new THREE.PointLight(0x7fb4ff, 30, 0, 2); cool.position.set(-3, 2, 2); scene.add(cool);

  // оболочка из точек, как кристаллическая решётка
  const N = 1600, pts = new Float32Array(N * 3), golden = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < N; i++) {
    const y = 1 - (i / (N - 1)) * 2, rad = Math.sqrt(1 - y * y), th = golden * i, R = 2.25;
    pts.set([Math.cos(th) * rad * R, y * R, Math.sin(th) * rad * R], i * 3);
  }
  const pg = new THREE.BufferGeometry(); pg.setAttribute('position', new THREE.BufferAttribute(pts, 3));
  const shell = new THREE.Points(pg, new THREE.PointsMaterial({ color: 0xffffff, size: 0.022, transparent: true, opacity: 0.55, depthWrite: false }));
  group.add(shell);
  const ringG = new THREE.BufferGeometry(), RN = 220, ring = new Float32Array(RN * 3);
  for (let i = 0; i < RN; i++) { const a = i / RN * Math.PI * 2; ring.set([Math.cos(a) * 2.9, 0, Math.sin(a) * 2.9], i * 3); }
  ringG.setAttribute('position', new THREE.BufferAttribute(ring, 3));
  const orbit = new THREE.Points(ringG, new THREE.PointsMaterial({ color: 0xff6a2b, size: 0.035, transparent: true, opacity: 0.9, depthWrite: false }));
  orbit.rotation.set(1.15, 0, 0.35);
  group.add(orbit);

  let px = 0, py = 0;
  addEventListener('pointermove', e => { px = e.clientX / innerWidth - 0.5; py = e.clientY / innerHeight - 0.5; }, { passive: true });
  const vis = watch(canvas);
  const pos = geo.attributes.position;
  function deform(time) {
    for (let i = 0; i < pos.count; i++) {
      const x = base[i * 3], y = base[i * 3 + 1], z = base[i * 3 + 2];
      const k = 1 + 0.075 * Math.sin(2.6 * x + time * 1.1) * Math.cos(2.2 * y - time * 0.8) + 0.05 * Math.sin(3.4 * z + time * 1.4 + y * 1.5);
      pos.setXYZ(i, x * k, y * k, z * k);
    }
    pos.needsUpdate = true; geo.computeVertexNormals();
  }
  function layout() {
    const wide = cam.aspect > 1.15;
    group.position.set(wide ? 1.9 : 0, wide ? 0.25 : 2.1, 0);
    group.scale.setScalar(wide ? 1 : 0.6);
  }
  const clock = new THREE.Clock();
  function frame() {
    requestAnimationFrame(frame);
    if (!vis.on) return;
    const resized = fit(r, cam);
    if (resized) layout();
    if (reduce && !resized) return;
    const time = clock.getElapsedTime();
    if (!reduce) {
      deform(time);
      shell.rotation.y = time * 0.06; orbit.rotation.z = 0.35 + time * 0.25;
      group.rotation.y += ((px * 0.6) - group.rotation.y) * 0.05;
      group.rotation.x += ((py * 0.4) - group.rotation.x) * 0.05;
    }
    r.render(scene, cam);
  }
  fit(r, cam); layout(); deform(0); r.render(scene, cam); frame();
}

/* ---------- шахта: полёт по тоннелю мимо рудных жил ---------- */
{
  const canvas = document.getElementById('caveCanvas');
  const r = makeRenderer(canvas, false);
  r.setClearColor(0x070808);
  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x070808, 0.045);
  // отражения только у металла: камень освещают фонарь и свечение жил
  const envTex = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture;
  const cam = new THREE.PerspectiveCamera(62, 1, 0.1, 200);
  scene.add(cam);
  const lamp = new THREE.PointLight(0xffd9b3, 90, 34, 1.7); lamp.position.set(0, 0.6, 0); cam.add(lamp);
  scene.add(new THREE.HemisphereLight(0x3a4a5a, 0x120d0a, 0.35));

  // путь: извилистая кривая вглубь
  const P = [];
  for (let i = 0; i <= 16; i++) P.push(new THREE.Vector3(Math.sin(i * 0.7) * 7, Math.sin(i * 0.45 + 1) * 3 - i * 1.2, -i * 18));
  const curve = new THREE.CatmullRomCurve3(P);
  const tube = new THREE.TubeGeometry(curve, 900, 6, 36, false);
  const tp = tube.attributes.position, tn = tube.attributes.normal, col = new Float32Array(tp.count * 3);
  const c = new THREE.Color();
  for (let i = 0; i < tp.count; i++) {
    const x = tp.getX(i), y = tp.getY(i), z = tp.getZ(i);
    const d = 1.6 * n3(x * 0.35, y * 0.35, z * 0.35) + 0.6 * n3(x * 1.1, y * 1.1, z * 1.1);
    tp.setXYZ(i, x + tn.getX(i) * d, y + tn.getY(i) * d, z + tn.getZ(i) * d);
    // лёгкие пятна поверх фото-текстуры, чтобы повтор не бросался в глаза
    const tone = 0.72 + 0.28 * (0.5 + 0.5 * n3(x * 0.15, y * 0.15, z * 0.15));
    c.setRGB(tone, tone * 0.96, tone * 0.92);
    col.set([c.r, c.g, c.b], i * 3);
  }
  tube.setAttribute('color', new THREE.BufferAttribute(col, 3));
  tube.computeVertexNormals();
  // фото-текстура скалы Cliff Side (Poly Haven, CC0): цвет, рельеф и ARM (затенение, шероховатость, металличность)
  const loader = new THREE.TextureLoader();
  const tex = (name, srgb, rx, ry) => {
    const tx = loader.load('tex/cliff_side_' + name + '_1k.jpg');
    tx.wrapS = tx.wrapT = THREE.RepeatWrapping; tx.repeat.set(rx, ry);
    tx.anisotropy = r.capabilities.getMaxAnisotropy();
    if (srgb) tx.colorSpace = THREE.SRGBColorSpace;
    return tx;
  };
  const rockMat = (rx, ry, side) => {
    const arm = tex('arm', false, rx, ry);
    return new THREE.MeshStandardMaterial({ map: tex('diff', true, rx, ry), normalMap: tex('nor_gl', false, rx, ry), normalScale: new THREE.Vector2(1.6, 1.6),
      aoMap: arm, roughnessMap: arm, metalnessMap: arm, roughness: 1, metalness: 1, vertexColors: side === THREE.BackSide, side });
  };
  scene.add(new THREE.Mesh(tube, rockMat(34, 4, THREE.BackSide)));
  const lumpMat = rockMat(1.5, 1.5, THREE.FrontSide);

  // рудные жилы: у каждого металла своя форма кристаллов и своя фото-текстура (ambientCG, CC0)
  const shapes = {
    Fe: () => new THREE.BoxGeometry(0.9, 0.9, 0.9),
    Cu: () => new THREE.OctahedronGeometry(0.6).scale(0.7, 1.8, 0.7),
    Zn: () => new THREE.CylinderGeometry(0.42, 0.42, 1.4, 6),
    Al: () => new THREE.BoxGeometry(1.3, 0.14, 0.9),
    Ti: () => new THREE.ConeGeometry(0.16, 2.4, 6),
    Au: () => new THREE.DodecahedronGeometry(0.55, 1)
  };
  // tint: оттенок поверх текстуры (у цинка и титана текстуры почти серые)
  const tint = { Fe: 0xffffff, Cu: 0xf07a3c, Zn: 0xc4d8e6, Al: 0xffffff, Ti: 0xcfc8f0, Au: 0xffb933 };
  const metalTex = (sym, map, srgb) => {
    const tx = loader.load('tex/' + sym + '_' + map + '.jpg');
    tx.anisotropy = r.capabilities.getMaxAnisotropy();
    if (srgb) tx.colorSpace = THREE.SRGBColorSpace;
    return tx;
  };
  const UP = new THREE.Vector3(0, 1, 0);
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const targets = [], groups = [];
  window.CAVE.forEach((m, i) => {
    const at = curve.getPointAt(m.u), tan = curve.getTangentAt(m.u);
    const side = new THREE.Vector3().crossVectors(tan, UP).normalize().multiplyScalar(i % 2 ? 1 : -1);
    const center = at.clone().addScaledVector(side, 4.4).add(new THREE.Vector3(0, (i % 3 - 1) * 1.1, 0));
    targets.push(center);
    const rock = new THREE.Mesh(new THREE.IcosahedronGeometry(1.7, 3), lumpMat);
    rock.position.copy(center).addScaledVector(side, 1.6); scene.add(rock);
    const color = new THREE.Color(m.color);
    const colorMap = metalTex(m.sym, 'color', true);
    const mat = new THREE.MeshStandardMaterial({
      map: colorMap, normalMap: metalTex(m.sym, 'normalgl', false), roughnessMap: metalTex(m.sym, 'roughness', false),
      color: tint[m.sym], metalness: 1, roughness: 1, envMap: envTex, envMapIntensity: 1.7,
      emissive: tint[m.sym], emissiveMap: colorMap, emissiveIntensity: 0.06
    });
    // друза: кристаллы растут из одной точки наружу, к тоннелю
    const g = new THREE.Group(); g.position.copy(center);
    for (let k = 0; k < 20; k++) {
      const dir = new THREE.Vector3(rnd() - 0.5, rnd() - 0.5, rnd() - 0.5).normalize();
      const out = dir.dot(side); if (out > 0) dir.addScaledVector(side, -2 * out);
      const mesh = new THREE.Mesh(shapes[m.sym](), mat);
      mesh.position.copy(dir).multiplyScalar(0.25 + rnd() * 1.1);
      mesh.quaternion.setFromUnitVectors(UP, dir);
      mesh.rotateY(rnd() * 6.28);
      mesh.scale.setScalar(0.5 + rnd() * 0.75);
      g.add(mesh);
    }
    scene.add(g); groups.push(g);
    const glow = new THREE.PointLight(color, 45, 16, 1.8);
    glow.position.copy(center).addScaledVector(side, -1.5); scene.add(glow);
  });

  // пыль в луче фонаря
  const DN = 1800, dust = new Float32Array(DN * 3);
  for (let i = 0; i < DN; i++) {
    const p = curve.getPointAt(rnd()), a = rnd() * 6.28, rr = rnd() * 4.5;
    dust.set([p.x + Math.cos(a) * rr, p.y + Math.sin(a) * rr, p.z + (rnd() - 0.5) * 2], i * 3);
  }
  const dg = new THREE.BufferGeometry(); dg.setAttribute('position', new THREE.BufferAttribute(dust, 3));
  const dot = document.createElement('canvas'); dot.width = dot.height = 32;
  const dc = dot.getContext('2d'), grd = dc.createRadialGradient(16, 16, 0, 16, 16, 16);
  grd.addColorStop(0, 'rgba(255,255,255,1)'); grd.addColorStop(1, 'rgba(255,255,255,0)');
  dc.fillStyle = grd; dc.fillRect(0, 0, 32, 32);
  scene.add(new THREE.Points(dg, new THREE.PointsMaterial({ color: 0xffe2c4, size: 0.06, map: new THREE.CanvasTexture(dot), transparent: true, opacity: 0.5, depthWrite: false, blending: THREE.AdditiveBlending })));

  const vis = watch(canvas);
  let cur = window.caveProgress || 0;
  const look = new THREE.Vector3(), tmp = new THREE.Vector3();
  const clock = new THREE.Clock();
  function frame() {
    requestAnimationFrame(frame);
    if (!vis.on) return;
    fit(r, cam);
    const goal = window.caveProgress || 0;
    cur += (goal - cur) * (reduce ? 1 : 0.08);
    const u = 0.02 + cur * 0.95;
    cam.position.copy(curve.getPointAt(u));
    // у остановки камера поворачивается к жиле
    let wMax = 0, best = null;
    window.CAVE.forEach((m, i) => { const w = Math.exp(-Math.pow((u - m.u) / 0.04, 2)); if (w > wMax) { wMax = w; best = targets[i]; } });
    tmp.copy(curve.getPointAt(Math.min(u + 0.02, 1)));
    if (best) tmp.lerp(best, wMax * 0.85);
    if (look.lengthSq() === 0) look.copy(tmp); else look.lerp(tmp, reduce ? 1 : 0.1);
    cam.lookAt(look);
    if (!reduce) { const time = clock.getElapsedTime(); groups.forEach((g, i) => { g.rotation.y = Math.sin(time * 0.3 + i) * 0.25; }); }
    r.render(scene, cam);
  }
  frame();
}
